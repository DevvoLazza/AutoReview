name: CI

on:
  pull_request:
  push:
    branches: [main, dev, 'codex/**']

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@24.16.0
          cache: true
          require-lockfile: true
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @reviewguard/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm --filter @reviewguard/mobile exec expo export --platform android --output-dir dist-android
      - run: pnpm --filter @reviewguard/mobile exec expo export --platform ios --output-dir dist-ios
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-diagnostics
          path: apps/web/test-results/
          retention-days: 3

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.2
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
